[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-claim-verification"
version = "0.1.0"
description = "Insurance claim document verification platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "Pillow>=10,<12",
    "pypdf>=5,<7",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
