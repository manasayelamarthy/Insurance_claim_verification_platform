<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insurance Claim Verification Platform</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 32px auto; padding: 0 16px; }
    select, button { padding: 8px; margin: 8px 0; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 12px; max-height: 360px; overflow: auto; }
    .ok { color: green; } .warn { color: #a15c00; }
  </style>
</head>
<body>
  <h1>Insurance Claim Verification Platform</h1>
  <p>Select a user to OCR the hospital bill and discharge summary and load the assigned policy.</p>
  <select id="users"></select>
  <button id="review">Review claim</button>
  <div id="result"></div>
  <script>
    const users = document.querySelector("#users");
    const result = document.querySelector("#result");
    fetch("/api/users").then(response => response.json()).then(items => {
      items.forEach(item => {
        const option = document.createElement("option");
        option.value = item.user_id;
        option.textContent = `${item.user_id} - ${item.patient_name} - ${item.hospital}`;
        users.appendChild(option);
      });
    });
    document.querySelector("#review").addEventListener("click", async () => {
      result.textContent = "Running OCR...";
      const response = await fetch(`/api/users/${users.value}/review`);
      const data = await response.json();
      if (!response.ok) {
        result.innerHTML = `<div class="card warn">${data.detail}</div>`;
        return;
      }
      const checks = data.ocr_validation.checks.map(check =>
        `<li class="${check.matched ? "ok" : "warn"}">${check.field}: ${check.matched ? "matched" : "not matched"} (${check.expected})</li>`
      ).join("");
      result.innerHTML = `
        <div class="card">
          <h2>${data.recommendation}</h2>
          <p>${data.recommendation_reason}</p>
          <p><strong>Patient:</strong> ${data.patient.name}</p>
          <p><strong>Hospital:</strong> ${data.hospital.name}</p>
          <p><strong>Policy:</strong> ${data.policy.name}</p>
          <h3>OCR validation</h3><ul>${checks}</ul>
          <h3>Hospital bill OCR text</h3><pre>${data.documents.hospital_bill.ocr_text}</pre>
        </div>`;
    });
  </script>
</body>
</html>
